<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Network — hero</title>
<style>
  :root{
    --bg:#060b1f;
    --ink:#eef2ff;
    --muted:#9aa6d1;
    --gold:#ffb347;
    --violet:#8f6bff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}

  /* ---------- hero shell ---------- */
  .hero{
    position:relative;min-height:100vh;display:grid;place-items:center;
    background:
      radial-gradient(60% 40% at 50% 100%,rgba(255,170,60,.18),transparent 70%),
      radial-gradient(50% 50% at 50% 0%,rgba(90,70,255,.25),transparent 70%),
      var(--bg);
    overflow:hidden;
  }

  /* square stage that scales with the viewport */
  .stage{
    position:relative;
    width:min(100vw,100vh,1100px);
    aspect-ratio:1/1;
    background:url(assets/bg.jpg) center/cover no-repeat;
    isolation:isolate;
  }

  /* hologram glow behind the gathered agents */
  .halo{
    position:absolute;left:34%;top:26%;width:32%;height:36%;
    border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,196,110,.35),rgba(255,160,60,.08) 60%,transparent);
    filter:blur(6px);opacity:0;z-index:1;
    transition:opacity 1.2s ease;
  }
  .stage.gathered .halo{opacity:1;animation:halo 4s ease-in-out infinite}
  @keyframes halo{50%{transform:scale(1.06);opacity:.85}}

  /* network lines drawn between agents once they settle */
  .net{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
  .net line{
    stroke:url(#g);stroke-width:1.6;stroke-linecap:round;
    stroke-dasharray:1000;stroke-dashoffset:1000;opacity:.9;
  }
  .stage.gathered .net line{animation:draw 1.4s cubic-bezier(.4,0,.2,1) forwards}
  .stage.gathered .net line:nth-child(n){animation-delay:calc(var(--i)*.12s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  .net circle{fill:#ffd88a;opacity:0}
  .stage.gathered .net circle{animation:blink 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
  @keyframes blink{0%,100%{opacity:0}50%{opacity:1}}

  /* ---------- agents ---------- */
  .agent{
    position:absolute;z-index:3;--hip:78%;--stride:.62s;--dir:1;
    /* geometry in % of the 1254px source image */
    left:var(--x);top:var(--y);width:var(--w);
    transform:translate(var(--dx,0),var(--dy,0)) scale(var(--s,1));
    will-change:transform;
  }
  .agent .body{display:block;position:relative;transform-origin:50% 100%}
  .agent .part{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
  .agent .leg{position:absolute;left:0;top:0}
  /* cut the flat image into torso + two legs; legs pivot at the hip */
  .agent .torso{clip-path:inset(0 0 calc(100% - var(--hip) - 2%) 0)}
  .agent .leg.l{clip-path:inset(var(--hip) 50% 0 0);transform-origin:25% var(--hip)}
  .agent .leg.r{clip-path:inset(var(--hip) 0 0 50%);transform-origin:75% var(--hip)}
  .agent .shadow{
    position:absolute;left:15%;right:15%;bottom:-4%;height:9%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);opacity:0;transition:opacity .4s;
  }

  /* walk cycle: legs swing opposite, torso bobs twice per stride and leans into the direction */
  .agent.walking .shadow{opacity:1;animation:shadow var(--stride) ease-in-out infinite}
  .agent.walking .leg.l{animation:swing var(--stride) ease-in-out infinite}
  .agent.walking .leg.r{animation:swing var(--stride) ease-in-out infinite;animation-delay:calc(var(--stride) / -2)}
  .agent.walking .torso{animation:bob calc(var(--stride) / 2) ease-in-out infinite}
  .agent.walking .body{transform:rotate(calc(var(--dir) * 4deg))}
  @keyframes swing{
    0%  {transform:rotate(-28deg)}
    50% {transform:rotate(28deg)}
    100%{transform:rotate(-28deg)}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(calc(var(--dir) * -1.5deg))}
    50%    {transform:translateY(-3.5%) rotate(calc(var(--dir) * 1.5deg))}
  }
  @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.8);opacity:.6}}

  /* floating idle once in place — the whole body drifts, legs relax */
  .agent.floating .body{animation:float var(--fd,3.6s) ease-in-out infinite;animation-delay:var(--fdl,0s)}
  .agent.floating .leg.l{animation:dangle 3.2s ease-in-out infinite}
  .agent.floating .leg.r{animation:dangle 3.2s ease-in-out infinite;animation-delay:-1.6s}
  @keyframes float{50%{transform:translateY(-5%)}}
  @keyframes dangle{50%{transform:rotate(4deg)}}
  /* the lead agent gets a subtle "breathing" glow */
  .agent.lead.floating .part{animation:glow 3.6s ease-in-out infinite}
  @keyframes glow{50%{filter:drop-shadow(0 10px 14px rgba(0,0,0,.45)) drop-shadow(0 0 22px rgba(120,220,255,.55))}}

  /* ---------- copy ---------- */
  .copy{
    position:absolute;left:0;right:0;bottom:clamp(16px,4vh,48px);
    text-align:center;z-index:5;padding:0 20px;
    opacity:0;transform:translateY(12px);transition:opacity .9s ease .2s,transform .9s ease .2s;
  }
  .stage.gathered ~ .copy,.hero.gathered .copy{opacity:1;transform:none}
  .copy h1{font-size:clamp(22px,3.4vw,44px);font-weight:600;letter-spacing:-.01em;margin:0 0 8px;text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .copy p{margin:0 0 18px;color:var(--muted);font-size:clamp(14px,1.4vw,18px)}
  .copy a{
    display:inline-block;padding:12px 26px;border-radius:999px;color:#1a1030;text-decoration:none;font-weight:600;
    background:linear-gradient(90deg,var(--gold),#ff8a5c);box-shadow:0 8px 30px rgba(255,150,60,.35);
  }
  .copy a:focus-visible{outline:3px solid #fff;outline-offset:3px}

  .replay{
    position:absolute;top:14px;right:14px;z-index:6;border:1px solid rgba(255,255,255,.25);
    background:rgba(10,14,40,.6);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;
  }

  @media (prefers-reduced-motion:reduce){
    .agent,.agent .body,.net line,.halo,.copy{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="stage" id="stage">
    <div class="halo"></div>

    <svg class="net" viewBox="0 0 1254 1254" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" x2="1">
          <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
          <stop offset="1" stop-color="#ffa14a" stop-opacity=".6"/>
        </linearGradient>
      </defs>
      <g id="lines"></g>
      <g id="dots"></g>
    </svg>

    <!--
      --x/--y : final top-left in % of the stage   --w : width in %
      data-side : which edge the agent walks in from
    -->
    <div class="agent"      data-side="left"  data-order="4" style="--x:35.8%;--y:33.8%;--w:7.4%;--hip:80%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/orange.png" alt=""><img class="part leg l" src="assets/orange.png" alt=""><img class="part leg r" src="assets/orange.png" alt=""></span></div>
    <div class="agent"      data-side="right" data-order="3" style="--x:56.2%;--y:34.4%;--w:9.2%;--hip:78%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/purple.png" alt=""><img class="part leg l" src="assets/purple.png" alt=""><img class="part leg r" src="assets/purple.png" alt=""></span></div>
    <div class="agent"      data-side="left"  data-order="2" style="--x:33.4%;--y:45.3%;--w:8.1%;--hip:80%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/teal.png" alt=""><img class="part leg l" src="assets/teal.png" alt=""><img class="part leg r" src="assets/teal.png" alt=""></span></div>
    <div class="agent"      data-side="right" data-order="1" style="--x:59.2%;--y:45.5%;--w:7.5%;--hip:78%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/gold.png" alt=""><img class="part leg l" src="assets/gold.png" alt=""><img class="part leg r" src="assets/gold.png" alt=""></span></div>
    <div class="agent"      data-side="right" data-order="5" style="--x:53.8%;--y:52.5%;--w:6.8%;--hip:75%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/small.png" alt=""><img class="part leg l" src="assets/small.png" alt=""><img class="part leg r" src="assets/small.png" alt=""></span></div>
    <div class="agent"      data-side="left"  data-order="6" style="--x:45.9%;--y:28.4%;--w:8.2%;--hip:78%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/top.png" alt=""><img class="part leg l" src="assets/top.png" alt=""><img class="part leg r" src="assets/top.png" alt=""></span></div>
    <div class="agent lead" data-side="right" data-order="0" style="--x:44.7%;--y:40.7%;--w:10.6%;--hip:80%"><span class="body"><span class="shadow"></span><img class="part torso" src="assets/center.png" alt=""><img class="part leg l" src="assets/center.png" alt=""><img class="part leg r" src="assets/center.png" alt=""></span></div>
  </div>

  <div class="copy">
    <h1>Autonomous agents, one verifiable network</h1>
    <p>Discover, connect and trust agents across chains.</p>
    <a href="#">Explore the catalog</a>
  </div>

  <button class="replay" id="replay" type="button">Replay</button>
</section>

<script>
(() => {
  const stage  = document.getElementById('stage');
  const hero   = document.getElementById('hero');
  const agents = [...stage.querySelectorAll('.agent')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* floor line where feet land while walking, in % of stage height */
  const FLOOR = 63;

  // network lines between agent centers (source-pixel coordinates)
  const centers = agents.map(a => {
    const s = a.style;
    const x = parseFloat(s.getPropertyValue('--x')), y = parseFloat(s.getPropertyValue('--y')), w = parseFloat(s.getPropertyValue('--w'));
    return {x:(x + w/2)*12.54, y:(y + w*1.2/2)*12.54};   // ≈ visual centre
  });
  const lead = agents.findIndex(a => a.classList.contains('lead'));
  const L = document.getElementById('lines'), D = document.getElementById('dots');
  let i = 0;
  centers.forEach((c,idx) => {
    if (idx === lead) return;
    const ln = document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',c.x); ln.setAttribute('y1',c.y);
    ln.setAttribute('x2',centers[lead].x); ln.setAttribute('y2',centers[lead].y);
    ln.style.setProperty('--i', i++); L.appendChild(ln);
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',c.x); dot.setAttribute('cy',c.y); dot.setAttribute('r',4);
    dot.style.setProperty('--i', idx); D.appendChild(dot);
  });

  function settle(){ stage.classList.add('gathered'); hero.classList.add('gathered'); }

  function play(){
    stage.classList.remove('gathered'); hero.classList.remove('gathered');
    agents.forEach(a => { a.classList.remove('walking','floating'); a.getAnimations().forEach(an => an.cancel()); });

    if (reduce){ agents.forEach(a => a.style.transform = ''); settle(); return; }

    const W = stage.clientWidth, H = stage.clientHeight;
    let lastEnd = 0;

    agents.forEach(a => {
      const cs   = getComputedStyle(a);
      const fx   = parseFloat(cs.getPropertyValue('--x'))/100*W;
      const fy   = parseFloat(cs.getPropertyValue('--y'))/100*H;
      const w    = parseFloat(cs.getPropertyValue('--w'))/100*W;
      const h    = a.offsetHeight || w*1.3;
      const side = a.dataset.side, order = +a.dataset.order;

      // where it starts (off-stage, on the floor) and where it stops walking
      const startX = side === 'left' ? -w*1.6 : W + w*0.6;
      const floorY = FLOOR/100*H - h*1.15;                 // feet on the floor, slightly larger (closer)
      const stopX  = fx + (side === 'left' ? -w*0.5 : w*0.5);

      const dxs = startX - fx, dys = floorY - fy;
      const dxe = stopX  - fx, dye = floorY - fy;

      const delay = 200 + order*380 + Math.random()*250;
      const dist  = Math.abs(dxs - dxe);
      const walk  = dist/W*2600 + 400;                     // constant walking speed for everyone
      a.style.setProperty('--dir', side === 'left' ? 1 : -1);
      a.style.setProperty('--stride', (0.58 + Math.random()*0.1).toFixed(2) + 's');
      const rise  = 1300;

      a.style.setProperty('--fd', (3.2 + order*0.25) + 's');
      a.style.setProperty('--fdl', (order*0.35) + 's');
      a.style.transform = `translate(${dxs}px,${dys}px) scale(1.15)`;

      const anim = a.animate([
        { transform:`translate(${dxs}px,${dys}px) scale(1.15)`, offset:0 },
        { transform:`translate(${dxs}px,${dys}px) scale(1.15)`, offset: 0.001, easing:'linear' },
        { transform:`translate(${dxe}px,${dye}px) scale(1.15)`, offset: walk/(walk+rise), easing:'cubic-bezier(.5,0,.15,1)' },
        { transform:`translate(0,0) scale(1)`, offset:1 }
      ], { duration: walk + rise, delay, easing:'linear', fill:'forwards' });

      setTimeout(() => a.classList.add('walking'), delay);
      setTimeout(() => a.classList.remove('walking'), delay + walk);
      anim.onfinish = () => { a.style.transform = ''; a.classList.add('floating'); };
      lastEnd = Math.max(lastEnd, delay + walk + rise);
    });

    setTimeout(settle, lastEnd - 500);
  }

  document.getElementById('replay').addEventListener('click', play);
  window.addEventListener('load', play);
})();
</script>
</body>
</html>
