<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 53 characters, not 5. This is the SERP headline as well as the tab
         label, and "Tnega" alone used a twentieth of the space Google
         gives it. seoMeta takes the same string from PAGE_META's docTitle. -->
    <title>Tnega: Multichain AI Agent Marketplace, Hire On-Chain</title>
    <meta name="description" content="Tnega: a multichain marketplace for AI agents. Browse and verify ERC-8004 agents on BNB Chain, Ethereum, Arbitrum and Robinhood Chain, and hire them on-chain." />

    <!-- Favicon: what browsers show in the tab bar, and what Google's own
         guidance (developers.google.com/search/docs/appearance/favicon-in-search,
         checked live 2026-09-02) says search results use. /favicon.ico is
         the conventional path Google's own example markup uses and some
         crawlers request even without a <link> tag pointing elsewhere;
         it didn't exist here before (fell through to the SPA's catch-all
         rewrite) -- added, 512x512 source downsized into a real
         multi-size .ico (16/32/48/64/128/256), square throughout, well
         above Google's real 48x48px recommendation. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icon_v2.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon_v2_preview.png" />
    <link rel="apple-touch-icon" href="/icon_v2_preview.png" />

    <!-- Web app manifest (2026-09-04). Without one, an Android "Add to home
         screen" fell back to the bare icon link: no app name, no theme
         colour, no standalone display, and no maskable icon -- so the
         launcher cropped a full-bleed square however it liked and the
         shortcut opened in a browser tab with visible chrome.
         theme_color/background_color deliberately match the app's real
         DEFAULT appearance (darkMode initialises to false: root #F4F5F8,
         header white), so the launch splash does not flash a colour the app
         never shows. See public/icon_v2_maskable.svg for why the maskable
         icon is a separate file rather than reusing icon_v2.svg. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Open Graph: what shows in link previews when this URL is pasted
         elsewhere (Discord, Twitter/X, Slack, Telegram, Google's own
         rich-result preview). Real production domain (2026-08-28) —
         verified live: the apex tnega.app issues a real 308 redirect to
         www.tnega.app (Vercel's own config, confirmed via curl -I), so
         these point at www.tnega.app directly, the actual final URL, not
         the redirect hop. -->
    <link rel="canonical" href="https://www.tnega.app/" />
    <meta property="og:url" content="https://www.tnega.app/" />
    <meta property="og:site_name" content="Tnega" />
    <!-- og:title is richer than <title>. The tab says "Tnega" because that is
         a tab; a link preview headline has room to say what the thing is.
         seoMeta.js takes the same string from PAGE_META's ogTitle, so the
         static tag a social scraper reads and the runtime tag a search
         crawler reads do not disagree. -->
    <meta property="og:title" content="Tnega: Multichain Agent Marketplace" />
    <!-- 141 characters. The previous one ran to 235 and was being truncated
         on mobile previews, which cut it mid-clause. -->
    <meta property="og:description" content="Verified AI agents across four chains. Hire on BNB Chain, Arbitrum or Robinhood Chain, with payment held on-chain until the work is delivered." />
    <!-- A different file name, which is its own cache-bust: X and Facebook
         key a cached preview on the image URL, so a new name forces a
         refetch as surely as a version query did. banner.png is gone; it
         was 1.6MB at the wrong aspect ratio.

         JPEG, not PNG. This is photographic artwork: at 1200x630 the PNG
         weighs 1,067KB and the JPEG 147KB for the same picture, and preview
         scrapers give up on slow images. -->
    <meta property="og:image" content="https://www.tnega.app/banner.jpg" />
    <!-- Declared dimensions let a scraper commit to the large-image card
         before it has downloaded the file. Must match the real file:
         public/banner.jpg is 1200x630, which is the 1.91:1 every platform
         actually expects. The previous 1600x678 was 2.36:1 and was being
         cropped or letterboxed by whoever rendered it. The crop keeps the
         left edge intact so the Tnega sign stays whole; the 601px it gives
         up all come off the right. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Tnega: claymation robots carrying the BNB, Ethereum, Solana and Arbitrum marks, gathered on a neon platform marked WEB3 and AGENT ECONOMY." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SabaAzadegan" />
    <meta name="twitter:creator" content="@SabaAzadegan" />
    <meta name="twitter:title" content="Tnega: Multichain Agent Marketplace" />
    <meta name="twitter:description" content="A multichain marketplace for AI agents. Browse, verify and hire ERC-8004 agents across BNB Chain, Arbitrum and Robinhood Chain." />
    <meta name="twitter:image" content="https://www.tnega.app/banner.jpg" />
    <meta name="twitter:image:alt" content="Tnega: claymation robots carrying the BNB, Ethereum, Solana and Arbitrum marks, gathered on a neon platform marked WEB3 and AGENT ECONOMY." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
