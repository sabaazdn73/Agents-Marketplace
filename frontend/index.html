<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The SERP headline as well as the tab label. seoMeta takes the same
         string from PAGE_META['/'].docTitle in App.jsx; change them together.
         Rewritten 2026-09-25 for the tokenized-equities product, and it says
         "being built" because nothing on the new pages is live yet. -->
    <title>Tnega: Tokenized Stocks, ETFs and Vaults, and What They Cost to Buy</title>
    <meta name="description" content="Tnega is being built: connect a wallet, pick a tokenized stock, ETF or vault, see what it costs to buy, and sign in your own wallet. EVM chains, Solana and Hyperliquid." />

    <!-- Favicon: what browsers show in the tab bar, and what Google's own
         guidance (developers.google.com/search/docs/appearance/favicon-in-search,
         checked live 2026-09-02) says search results use. /favicon.ico is
         the conventional path Google's own example markup uses and some
         crawlers request even without a <link> tag pointing elsewhere;
         it didn't exist here before (fell through to the SPA's catch-all
         rewrite) -- added, 512x512 source downsized into a real
         multi-size .ico (16/32/48/64/128/256), square throughout, well
         above Google's real 48x48px recommendation. -->
    <!-- All generated from frontend/iconlogo.png on 2026-09-11, so the tab,
         the Windows/macOS dock shortcut, the iOS home screen and the Android
         launcher all show the same clay mark rather than the older flat one.
         The SVG is gone from this list on purpose: it was a different
         drawing, and a browser preferring it would have shown a different
         icon from the one on the home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web app manifest (2026-09-04). Without one, an Android "Add to home
         screen" fell back to the bare icon link: no app name, no theme
         colour, no standalone display, and no maskable icon -- so the
         launcher cropped a full-bleed square however it liked and the
         shortcut opened in a browser tab with visible chrome.
         theme_color/background_color in the manifest are fixed values; the
         launcher cannot follow a theme. The theme-color meta below is kept
         current by the inline script and by theme/ThemeProvider.jsx. See public/icon_v2_maskable.svg for why the maskable
         icon is a separate file rather than reusing icon_v2.svg. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F9F9F9" />

    <!-- THEME BEFORE FIRST PAINT. The visitor's mode is in
         localStorage['tnega_theme'] (system, light or dark; system when
         unset or unreadable). Resolving it here, before the bundle loads,
         is what keeps a dark-mode visitor from seeing one light frame and
         then a flip. theme/ThemeProvider.jsx applies the same rule
         (resolveDark) once React is running; the two must agree.
         The two page colours below repeat --page from src/index.css so the
         first frame is right even before that stylesheet arrives. Change
         them together. -->
    <style>html{background:#F9F9F9;color-scheme:light}html.dark{background:#000000;color-scheme:dark}</style>
    <script>
      // SITE DATA BLOCKED. Reading localStorage then throws a SecurityError,
      // and several libraries (RainbowKit's recent-wallet list, WalletConnect)
      // read it with no try around the read, which left the whole site blank.
      // So when the store cannot be read, an in-memory store takes its place
      // before any module loads: everything works, nothing survives the page,
      // which is what blocking site data asks for. window.__storageBlocked lets
      // the app say so where it matters (the theme control).
      (function () {
        var blocked = false;
        try { window.localStorage.getItem('tnega_probe'); } catch (e) { blocked = true; }
        if (!blocked) return;
        var mem = {};
        var has = function (k) { return Object.prototype.hasOwnProperty.call(mem, k); };
        var shim = {
          getItem: function (k) { k = String(k); return has(k) ? mem[k] : null; },
          setItem: function (k, v) { mem[String(k)] = String(v); },
          removeItem: function (k) { delete mem[String(k)]; },
          clear: function () { mem = {}; },
          key: function (i) { var ks = Object.keys(mem); return i < ks.length ? ks[i] : null; },
          get length() { return Object.keys(mem).length; }
        };
        try {
          Object.defineProperty(window, 'localStorage', { value: shim, configurable: true });
          window.__storageBlocked = true;
        } catch (e) {}
      })();
      (function () {
        var mode = 'system';
        try {
          var v = window.localStorage.getItem('tnega_theme');
          if (v === 'light' || v === 'dark' || v === 'system') mode = v;
        } catch (e) {}
        var prefersDark = false;
        try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && prefersDark);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.setAttribute('data-theme-mode', mode);
        root.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#F9F9F9');
      })();
    </script>

    <!-- Open Graph: what shows in link previews when this URL is pasted
         elsewhere (Discord, Twitter/X, Slack, Telegram, Google's own
         rich-result preview). Real production domain (2026-08-28) —
         verified live: the apex tnega.app issues a real 308 redirect to
         www.tnega.app (Vercel's own config, confirmed via curl -I), so
         these point at www.tnega.app directly, the actual final URL, not
         the redirect hop. -->
    <link rel="canonical" href="https://www.tnega.app/" />
    <meta property="og:url" content="https://www.tnega.app/" />
    <meta property="og:site_name" content="Tnega" />
    <!-- og:title is richer than <title>. The tab says "Tnega" because that is
         a tab; a link preview headline has room to say what the thing is.
         seoMeta.js takes the same string from PAGE_META's ogTitle, so the
         static tag a social scraper reads and the runtime tag a search
         crawler reads do not disagree. -->
    <meta property="og:title" content="Tnega: Tokenized Stocks, ETFs and Vaults" />
    <!-- Must say what PAGE_META['/'] says in App.jsx: social scrapers read
         this static tag, search crawlers run the app and read that one. It
         says "being built" until the pages hold something live. The banner
         image below still shows the agents artwork; replacing it is a
         separate change. -->
    <meta property="og:description" content="Being built: pick a tokenized stock, ETF or vault, see what it costs to buy, and sign in your own wallet." />
    <!-- X and Facebook key a cached preview on the image URL, so the ?v=
         forces a refetch when the file changes under the same name. Bump it
         whenever the banner does.

         JPEG, not PNG: this is photographic artwork, and at 1200x630 the
         PNG weighs 1,067KB against the JPEG's 158KB. Scrapers give up on
         slow images. -->
    <meta property="og:image" content="https://www.tnega.app/banner.jpg?v=6" />
    <!-- Declared dimensions let a scraper commit to the large-image card
         before it has downloaded the file. Must match the real file:
         public/banner.jpg is 1200x630, the 1.91:1 every platform expects.

         Reached by scaling the whole frame down and letterboxing it, NOT by
         cropping. An earlier version cut 601px off the right to make the
         ratio, which deleted the Arbitrum robot outright: content thrown
         away to hit a number, when setting the ratio here is precisely what
         stops a platform cropping it. The bars are exactly 60px top and
         bottom, and they carry the headline and the call to action, so the
         artwork keeps every pixel and nothing sits on top of it. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Tnega: claymation robots carrying the BNB, Ethereum, Solana and Arbitrum marks, gathered on a neon platform marked WEB3 and AGENT ECONOMY." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SabaAzadegan" />
    <meta name="twitter:creator" content="@SabaAzadegan" />
    <meta name="twitter:title" content="Tnega: Tokenized Stocks, ETFs and Vaults" />
    <meta name="twitter:description" content="Being built: pick a tokenized stock, ETF or vault, see what it costs to buy, and sign in your own wallet." />
    <meta name="twitter:image" content="https://www.tnega.app/banner.jpg?v=6" />
    <meta name="twitter:image:alt" content="Tnega: claymation robots carrying the BNB, Ethereum, Solana and Arbitrum marks, gathered on a neon platform marked WEB3 and AGENT ECONOMY." />
    <!-- Structured data. There was none, so Google had only the raw text
         of a JavaScript-rendered page to work from and nothing telling it
         what this site IS. Organization ties the name, logo and accounts
         together so they are treated as one entity. The WebSite
         description is the page's own meta description, word for word. No
         SearchAction: the search field does not search anything yet, and a
         sitelinks search box would send people to an empty result. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://www.tnega.app/#website",
      "url": "https://www.tnega.app/",
      "name": "Tnega",
      "description": "Tnega is being built: connect a wallet, pick a tokenized stock, ETF or vault, see what it costs to buy, and sign in your own wallet. EVM chains, Solana and Hyperliquid.",
      "publisher": {
        "@id": "https://www.tnega.app/#org"
      }
    },
    {
      "@type": "Organization",
      "@id": "https://www.tnega.app/#org",
      "name": "Tnega",
      "url": "https://www.tnega.app/",
      "logo": "https://www.tnega.app/app-icon-512.png",
      "sameAs": [
        "https://x.com/SabaAzadegan",
        "https://github.com/sabaazdn73/Agents-Marketplace"
      ]
    }
  ]
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
