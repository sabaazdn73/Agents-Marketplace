<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The SERP headline as well as the tab label. seoMeta takes the same
         string from PAGE_META['/'].docTitle in App.jsx; change them together.
         __TNEGA_...__ placeholders are filled at build and in dev from
         src/siteCopy.js (vite.config.js), the one copy of the site's title
         and description, which follows DATA_LIVE (src/dataLive.js). -->
    <title>__TNEGA_TITLE__</title>
    <meta name="description" content="__TNEGA_DESCRIPTION__" />

    <!-- Favicon: what browsers show in the tab bar, and what Google's own
         guidance (developers.google.com/search/docs/appearance/favicon-in-search,
         checked live 2026-09-02) says search results use. /favicon.ico is
         the conventional path Google's own example markup uses and some
         crawlers request even without a <link> tag pointing elsewhere;
         it didn't exist here before (fell through to the SPA's catch-all
         rewrite). It is a real .ico with 16, 32 and 48px frames; 48px is
         the minimum Google's guidance asks for, and the 192 and 512px PNGs
         declared below give search a larger square to choose. -->
    <!-- Fendi, the Tnega cat, on the navy tile (owner's decision,
         2026-09-27: Fendi replaces the logo everywhere). These files are the
         owner's brand assets, copied unchanged: favicon.ico carries 16, 32
         and 48px frames of Fendi's face, drawn to be read at 16px;
         app-icon-maskable-512.png keeps Fendi inside the maskable safe zone;
         apple-touch-icon.png is square because iOS rounds the corners itself
         and would fill transparent ones with black.
         The ?v=3 on these links, on the manifest link and on the manifest's
         own icon srcs makes browsers and launchers that cache an icon by URL
         fetch Fendi rather than keep the tile they had. Bump it when the
         icons change again. /favicon.ico itself is also requested bare by
         crawlers, and gets the new file at that path. -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/app-icon-512.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <!-- Web app manifest (2026-09-04). Without one, an Android "Add to home
         screen" fell back to the bare icon link: no app name, no theme
         colour, no standalone display, and no maskable icon -- so the
         launcher cropped a full-bleed square however it liked and the
         shortcut opened in a browser tab with visible chrome.
         theme_color/background_color in the manifest are fixed values; the
         launcher cannot follow a theme. The theme-color meta below is kept
         current by the inline script and by theme/ThemeProvider.jsx. The maskable icon is its own file because a
         launcher crops it to its own shape, so Fendi sits further in. -->
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="theme-color" content="#EDEDEF" />
    <!-- The one font file every page needs first, from this site's own
         origin (src/index.css @font-face; never a font host). -->
    <link rel="preload" href="/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- THEME BEFORE FIRST PAINT. The visitor's mode is in
         localStorage['tnega_theme'] (system, light or dark; system when
         unset or unreadable). Resolving it here, before the bundle loads,
         is what keeps a dark-mode visitor from seeing one light frame and
         then a flip. theme/ThemeProvider.jsx applies the same rule
         (resolveDark) once React is running; the two must agree.
         The two page colours below repeat --page from src/index.css so the
         first frame is right even before that stylesheet arrives. Change
         them together.
         The script below is allowed by its sha256 in vercel.json's
         Content-Security-Policy. Editing it changes the hash; the build
         fails until vercel.json matches (scripts/csp_hash_selfcheck.mjs). -->
    <style>html{background:#EDEDEF;color-scheme:light}html.dark{background:#000000;color-scheme:dark}</style>
    <script>
      // SITE DATA BLOCKED. Reading localStorage then throws a SecurityError,
      // and several libraries (RainbowKit's recent-wallet list, WalletConnect)
      // read it with no try around the read, which left the whole site blank.
      // So when the store cannot be read, an in-memory store takes its place
      // before any module loads: everything works, nothing survives the page,
      // which is what blocking site data asks for. window.__storageBlocked lets
      // the app say so where it matters (the theme control).
      (function () {
        var blocked = false;
        try { window.localStorage.getItem('tnega_probe'); } catch (e) { blocked = true; }
        if (!blocked) return;
        var mem = {};
        var has = function (k) { return Object.prototype.hasOwnProperty.call(mem, k); };
        var shim = {
          getItem: function (k) { k = String(k); return has(k) ? mem[k] : null; },
          setItem: function (k, v) { mem[String(k)] = String(v); },
          removeItem: function (k) { delete mem[String(k)]; },
          clear: function () { mem = {}; },
          key: function (i) { var ks = Object.keys(mem); return i < ks.length ? ks[i] : null; },
          get length() { return Object.keys(mem).length; }
        };
        try {
          Object.defineProperty(window, 'localStorage', { value: shim, configurable: true });
          window.__storageBlocked = true;
        } catch (e) {}
      })();
      (function () {
        var mode = 'system';
        try {
          var v = window.localStorage.getItem('tnega_theme');
          if (v === 'light' || v === 'dark' || v === 'system') mode = v;
        } catch (e) {}
        var prefersDark = false;
        try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
        var dark = mode === 'dark' || (mode === 'system' && prefersDark);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.setAttribute('data-theme-mode', mode);
        root.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#000000' : '#EDEDEF');
      })();
    </script>

    <!-- Open Graph: what shows in link previews when this URL is pasted
         elsewhere (Discord, Twitter/X, Slack, Telegram, Google's own
         rich-result preview). Real production domain (2026-08-28) —
         verified live: the apex tnega.app issues a real 308 redirect to
         www.tnega.app (Vercel's own config, confirmed via curl -I), so
         these point at www.tnega.app directly, the actual final URL, not
         the redirect hop. -->
    <link rel="canonical" href="https://www.tnega.app/" />
    <meta property="og:url" content="https://www.tnega.app/" />
    <meta property="og:site_name" content="Tnega" />
    <!-- og:title is richer than <title>. The tab says "Tnega" because that is
         a tab; a link preview headline has room to say what the thing is.
         seoMeta.js takes the same string from PAGE_META's ogTitle, so the
         static tag a social scraper reads and the runtime tag a search
         crawler reads do not disagree. -->
    <meta property="og:title" content="__TNEGA_OG_TITLE__" />
    <!-- The link-preview line, the banner's own words (src/siteCopy.js
         ogDescription). Must say what PAGE_META['/'] says in App.jsx: social
         scrapers read this static tag, search crawlers run the app and read
         that one. -->
    <meta property="og:description" content="__TNEGA_OG_DESCRIPTION__" />
    <!-- X and Facebook key a cached preview on the image URL, so the ?v=
         forces a refetch when the file changes under the same name. Bump it
         whenever the card does.

         public/banner.jpg is the owner's banner (2026-09-27), 1200x630:
         "Wealth, borderless." and its line, two product cards in the site's
         own style (one marked EXAMPLE) and Fendi waving. -->
    <meta property="og:image" content="https://www.tnega.app/banner.jpg?v=5" />
    <!-- Declared dimensions let a scraper commit to the large-image card
         before it has downloaded the file. Must match the file: 1200x630,
         the 1.91:1 every platform expects. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="The words Wealth, borderless. and Every tokenized stock, on every chain, and what it really costs you to buy, beside two example Tnega cards and Fendi, the Tnega cat, waving." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SabaAzadegan" />
    <meta name="twitter:creator" content="@SabaAzadegan" />
    <meta name="twitter:title" content="__TNEGA_OG_TITLE__" />
    <meta name="twitter:description" content="__TNEGA_OG_DESCRIPTION__" />
    <meta name="twitter:image" content="https://www.tnega.app/banner.jpg?v=5" />
    <meta name="twitter:image:alt" content="The words Wealth, borderless. and Every tokenized stock, on every chain, and what it really costs you to buy, beside two example Tnega cards and Fendi, the Tnega cat, waving." />
    <!-- Structured data. There was none, so Google had only the raw text
         of a JavaScript-rendered page to work from and nothing telling it
         what this site IS. Organization ties the name, logo and accounts
         together so they are treated as one entity. The WebSite
         description is the page's own meta description, word for word. No
         SearchAction: a sitelinks search box would promise results before
         the search endpoint is proven. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://www.tnega.app/#website",
      "url": "https://www.tnega.app/",
      "name": "Tnega",
      "description": "__TNEGA_DESCRIPTION__",
      "publisher": {
        "@id": "https://www.tnega.app/#org"
      }
    },
    {
      "@type": "Organization",
      "@id": "https://www.tnega.app/#org",
      "name": "Tnega",
      "url": "https://www.tnega.app/",
      "logo": "https://www.tnega.app/app-icon-512.png",
      "sameAs": [
        "https://x.com/SabaAzadegan",
        "https://github.com/sabaazdn73/Agents-Marketplace"
      ]
    }
  ]
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
