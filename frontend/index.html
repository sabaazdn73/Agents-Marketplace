         elsewhere (Discord, Twitter/X, Slack, Telegram, Google's own

         path, once the site has its final production domain. -->
    <meta property="og:title" content="Agents Marketplace" />
    <meta property="og:description" content="Discover, verify, and hire ERC-8004 agents on BNB Smart Chain with enforceable financial limits." />
