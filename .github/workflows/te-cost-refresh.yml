# te-cost-refresh.yml
#
# Refreshes the tokenized-equity cost measurements every 8 hours, as a backup
# for the Render worker loop (backend/worker.py, te_cost_loop).
#
# WHY IT EXISTS
# -------------
# The dashboard shows no dollar value for a position whose last pool price is
# more than a day old. If the Render loop stops (a restart without
# TE_COST_ENABLED=1, a crash, a held lease), prices go stale and every
# position loses its value. This job runs one full cycle on a runner so the
# data never ages past a day, whatever happens on Render.
#
# HOW IT BEHAVES
# --------------
# It runs the same run_cycle the worker runs, against the same MongoDB. It
# takes the same lease ("te_cost_cycle"), so if the Render loop is healthy and
# holds the lease, this run is skipped, not duplicated. It never signs or
# holds anything; it only reads chains and writes measurements.
#
# SECRETS (GitHub: Settings > Secrets and variables > Actions)
#   MONGODB_URI       required, the same value Render uses
#   MONGODB_DB_NAME   optional, defaults to agents_marketplace
#   TE_SOLANA_RPC     optional, a Solana RPC URL (only used once the Solana
#                     pass exists on this branch)
#
# GitHub throttles scheduled runs, so a slot can be skipped or delayed. Three
# slots a day leaves two spare before the one-day limit is reached.

name: Cost measurement refresh

on:
  schedule:
    - cron: "23 */8 * * *"
  workflow_dispatch:

concurrency:
  group: te-cost-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet motor httpx python-dotenv certifi eth-abi eth-utils "eth-hash[pycryptodome]"

      - name: Check the secret is present
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "MONGODB_URI is not set as a repository secret; nothing can be written." >&2
            exit 1
          fi

      - name: Run one cost cycle
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || secrets.MONGO_DB_NAME }}
          TE_SOLANA_RPC: ${{ secrets.TE_SOLANA_RPC }}
          TE_COST_ENABLED: "1"
          # Longer than the worker's 600 s: this job runs three times a day,
          # not every two minutes, so one run has to cover more versions.
          TE_SOLANA_BUDGET_S: "1800"
        run: |
          python - <<'PY'
          import asyncio, json, logging, sys
          logging.basicConfig(level=logging.INFO)
          from core.te.cost_store import get_store
          import core.te.cost_worker as cw

          async def main() -> int:
              store = get_store()
              summary = await cw.run_cycle(store)
              print("EVM cycle:", json.dumps(summary, default=str))
              bad = [k for k, v in summary.items() if isinstance(v, str) and v.startswith("failed") and "deadline" not in v]
              if hasattr(cw, "run_solana_cycle"):
                  s = await cw.run_solana_cycle(store)
                  print("Solana pass:", json.dumps(s, default=str))
              if "skipped" in summary:
                  print("Skipped: another process holds the cost-cycle lease (the Render loop is running).")
                  return 0
              if bad:
                  print("Chains that failed:", bad, file=sys.stderr)
                  return 1
              return 0

          sys.exit(asyncio.run(main()))
          PY
