# full-registry-batch.yml
#
# Real, scheduled trigger for the batches that have NO other driver:
# the ERC-8183 job index, the marketplace health check, the Solana scan,
# and the five additional chains (Monad, Billions, Robinhood, Celo,
# Arbitrum). Each goes through its own real, secret-gated
# backend/server.py POST /api/admin/* endpoint.
#
# Trimmed 2026-09-04, after a real audit of every automation in this
# project found genuine duplication. Two steps were removed, NOT because
# they were broken in themselves, but because the Render background
# worker (backend/worker.py) already runs the exact same three functions
# continuously:
#
#   * /api/admin/full-registry-batch  -> run_ingest_batch +
#     run_analysis_batch, both already driven by worker.py's ingest_loop
#     and analysis_loop.
#   * /api/admin/escrow-compat-audit-batch -> run_audit_batch, already
#     driven by worker.py's audit_loop.
#
# The worker is the better home for all three, for a real, specific
# reason beyond just "pick one": it is a long-running loop with no HTTP
# timeout over it, and it has real backlog pacing
# (INGEST_BACKLOG_PAUSE_THRESHOLD) that this workflow path has no
# equivalent of. The removed ingest step was failing consistently for
# exactly that structural reason -- 8004scan's real deep-offset
# degradation (live-confirmed: offsets 700k/806k/808k+ all time out,
# offset 0 returns in ~1s) sends the backend into 4s/8s/16s exponential
# backoff, which routinely outlives curl's --max-time 300 and fails the
# step even though the backend itself is working correctly. The worker
# hits the same slow upstream but simply keeps going.
#
# Real honesty about the trade: this removes redundancy. The worker is
# now the ONLY driver of ingestion, analysis, and the escrow audit, so
# if it dies, those three stop with no scheduled fallback. That is a
# deliberate choice, made because the worker is demonstrably alive
# (its checkpoints were advancing minutes before this change, while the
# workflow's own last run was hours old and had failed) and because
# double-running the same work against an already-degraded upstream API
# helps nobody. Worth revisiting if the worker ever proves unreliable.
#
# Real, standing gap this closes: that pipeline had no scheduler at all —
# Render Cron Jobs are a paid-plan feature, out of scope per this project's
# own standing "no paid/unknown-cost infrastructure without an explicit
# decision" rule (see docs/full-registry-analysis.md) — so it only ever
# advanced when a human ran scripts/full_registry_scan.py by hand. GitHub
# Actions' scheduled workflows are genuinely free for this: confirmed live
# (2026-08-28) this repository is real, public (github.com API:
# `"private": false, "visibility": "public"`), and GitHub's own current
# docs state plainly — "GitHub Actions usage is free for standard
# GitHub-hosted runners in public repositories" — no minute cap at all,
# unlike the 2,000 min/month a private repo on the Free plan would get.
# This workflow's real, expected usage (one ~10-second HTTP call every 6
# hours) is nowhere close to mattering even under that private-repo figure,
# but it's genuinely, unconditionally free here either way.
#
# Real schedule chosen: every 6 hours. The pipeline's own script docstring
# already recommended "repeated every few hours" for ingestion and "daily
# is more than enough" for analysis (health-check TTL is 20 minutes, so
# more frequent analysis mostly just re-checks already-fresh agents); every
# 6 hours runs both together on the same real, cheap trigger, comfortably
# inside that guidance, without being needlessly aggressive on a resumable
# pipeline where a short, frequent batch makes exactly as much real
# progress over time as a long, rare one.
#
# Real security: the actual ingest/analyze work happens ONLY behind the
# backend's own real X-Batch-Secret check (BATCH_TRIGGER_SECRET, an env var
# set identically here as a GitHub Actions repository secret and on the
# Render backend service) — this workflow never holds real database or
# 8004scan credentials itself, only the one shared trigger secret.
#
# Real, second step added (2026-08-28): core/job_index.py's own real,
# complete ERC-8183 job index — the fix for a real, confirmed bug where
# core/revenue.py's "Revenue Stream" was silently excluding ~97% of all
# real job history (see docs/verification-methodology.md). Kept as its
# own step (own endpoint call) rather than folded into the first one, so
# each individual HTTP call stays safely inside the real, observed ~75s
# Render timeout zone documented in backend/server.py.
#
# Real, third step added (2026-08-28): a real, INDEPENDENT Live Status
# reliability pass (POST /api/admin/health-check-batch) — decoupled from
# the much heavier full-registry-backed marketplace refresh, which was
# confirmed this session to repeatedly OOM-crash under real memory
# pressure (see core/aggregate.py's own real fix commits). When that
# heavier refresh fails partway through, service-health data used to go
# stale right along with it, silently. This step keeps Live Status fresh
# on the same real schedule regardless of whether the heavier refresh
# succeeds that cycle.
#
# Real, fourth step added (2026-08-28): a real, dedicated Solana ingestion
# pass (POST /api/admin/solana-registry-batch) — real, urgent correction:
# Solana was wrongly assumed to need a genuinely separate technical
# integration and left out of this pipeline entirely; confirmed live that
# 8004scan's own unified API already indexes it via the real, correct
# `chain_id=101` param, it just never rides along in the shared EVM scan
# the other three chains use, so it gets its own real, cheap, separate
# step here rather than joining TARGET_CHAIN_IDS (see
# core/full_registry_ingest.py's own docstring for the full real
# correction). Stored the same way Base/Ethereum are — same
# full_agent_registry collection, not surfaced on the live BSC-only
# marketplace yet.

# A fifth step, calling the escrow-compatibility audit
# (POST /api/admin/escrow-compat-audit-batch), was added 2026-08-28,
# removed 2026-08-29 when a dedicated Render Background Worker
# (backend/worker.py, service escrow-compat-audit-worker) took over running
# the same audit continuously, and restored the same day as a deliberate,
# real, redundant safety net — NOT an oversight or a sign the worker is
# assumed broken. The worker had two real, distinct crashes in its first
# ~35 minutes (a missing-file startup error, then an OOM from an unbounded
# in-process cache), both found and fixed; it's since run clean, but a
# single background process is still a single point of failure, and this
# step costs nothing extra to keep running alongside it. If the worker
# ever silently stalls or dies for a reason not yet seen, this scheduled,
# request-cycle-bound step keeps real progress moving regardless — slower
# than the worker at full throughput, but never fully stopped. Both are
# intentionally kept; this is not choosing one over the other.

# A sixth step, calling POST /api/admin/multichain-registry-batch, was
# added 2026-09-10 for five more real chains 8004scan indexes but this
# pipeline didn't yet cover: Monad, Billions Network, Robinhood Chain,
# Celo, Arbitrum. Same real reasoning as the Solana step above — none of
# these ride along in the shared, unfiltered EVM scan, so each needs its
# own real chain_id-filtered pass and its own real progress checkpoint
# (see core/full_registry_ingest.py's ADDITIONAL_CHAINS). Same
# full_agent_registry collection, not surfaced on the live BSC-only
# marketplace, background collection only.

name: Scheduled batches (job index + health check + solana + multichain)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours, real UTC times: 00:00, 06:00, 12:00, 18:00
  workflow_dispatch: {}       # real, manual trigger — used to verify this end-to-end

jobs:
  trigger-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Call the real /api/admin/job-index-batch endpoint
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://agents-marketplace-q3k4.onrender.com' }}
          BATCH_TRIGGER_SECRET: ${{ secrets.BATCH_TRIGGER_SECRET }}
        run: |
          if [ -z "$BATCH_TRIGGER_SECRET" ]; then
            echo "::error::BATCH_TRIGGER_SECRET repository secret is not set — see docs/full-registry-analysis.md for setup."
            exit 1
          fi
          echo "Calling $BACKEND_BASE_URL/api/admin/job-index-batch ..."
          http_status=$(curl -sS -o response2.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "X-Batch-Secret: ${BATCH_TRIGGER_SECRET}" \
            "${BACKEND_BASE_URL}/api/admin/job-index-batch")
          echo "Real HTTP status: $http_status"
          echo "Real response body:"
          cat response2.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Real job-index batch trigger failed with HTTP $http_status"
            exit 1
          fi

      - name: Call the real /api/admin/health-check-batch endpoint
        if: always()   # each batch is independent; a transient failure in one must not skip the rest
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://agents-marketplace-q3k4.onrender.com' }}
          BATCH_TRIGGER_SECRET: ${{ secrets.BATCH_TRIGGER_SECRET }}
        run: |
          echo "Calling $BACKEND_BASE_URL/api/admin/health-check-batch ..."
          http_status=$(curl -sS -o response3.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "X-Batch-Secret: ${BATCH_TRIGGER_SECRET}" \
            "${BACKEND_BASE_URL}/api/admin/health-check-batch")
          echo "Real HTTP status: $http_status"
          echo "Real response body:"
          cat response3.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Real health-check batch trigger failed with HTTP $http_status"
            exit 1
          fi

      - name: Call the real /api/admin/solana-registry-batch endpoint
        if: always()   # each batch is independent; a transient failure in one must not skip the rest
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://agents-marketplace-q3k4.onrender.com' }}
          BATCH_TRIGGER_SECRET: ${{ secrets.BATCH_TRIGGER_SECRET }}
        run: |
          echo "Calling $BACKEND_BASE_URL/api/admin/solana-registry-batch ..."
          http_status=$(curl -sS -o response4.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "X-Batch-Secret: ${BATCH_TRIGGER_SECRET}" \
            "${BACKEND_BASE_URL}/api/admin/solana-registry-batch")
          echo "Real HTTP status: $http_status"
          echo "Real response body:"
          cat response4.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Real Solana batch trigger failed with HTTP $http_status"
            exit 1
          fi

      - name: Call the real /api/admin/multichain-registry-batch endpoint
        if: always()   # each batch is independent; a transient failure in one must not skip the rest
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://agents-marketplace-q3k4.onrender.com' }}
          BATCH_TRIGGER_SECRET: ${{ secrets.BATCH_TRIGGER_SECRET }}
        run: |
          echo "Calling $BACKEND_BASE_URL/api/admin/multichain-registry-batch ..."
          http_status=$(curl -sS -o response6.json -w "%{http_code}" \
            --max-time 300 \
            -X POST \
            -H "X-Batch-Secret: ${BATCH_TRIGGER_SECRET}" \
            "${BACKEND_BASE_URL}/api/admin/multichain-registry-batch")
          echo "Real HTTP status: $http_status"
          echo "Real response body:"
          cat response6.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "::error::Real multichain batch trigger failed with HTTP $http_status"
            exit 1
          fi

