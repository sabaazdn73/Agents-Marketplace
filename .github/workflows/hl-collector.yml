# hl-collector.yml
#
# Rebuilds the Hyperliquid collector's target set. It no longer polls.
#
# WHAT CHANGED AND WHY, 2026-09-15
# --------------------------------
# This workflow used to run the 15-minute poll cycle. It was correct and it
# was running, but GitHub throttles a short-interval cron hard: between 10:25
# and 19:15 it had about 35 scheduled slots and fired twice, roughly a 94%
# skip, with the two runs four hours apart. The collector records the window
# it actually covered so nothing was corrupted, but a four-hour sampling
# interval against a 2,000-record buffer that turns over in under a minute for
# the fastest makers is not the instrument that was designed.
#
# The poll loop therefore moved into the Render web process, which keeps its
# own clock (server.py, _hl_collect_loop, HL_COLLECTOR_ENABLED=true).
#
# WHAT STAYED HERE, AND WHY IT IS THE RIGHT HALF
# ----------------------------------------------
# Target selection, for two reasons that both point away from Render.
#
# Memory: the leaderboard is a 37MB JSON document of ~45,000 rows and parsing
# it costs several hundred megabytes. Both Render services are OOM-killed on a
# 512Mi cap (docs/memory-ceiling.md). A runner has its own memory and nothing
# else to take down.
#
# Rate budget: selection probes candidates against historicalOrders, the same
# endpoint and the same 1,200 weight/minute PER-IP budget the poll loop
# spends. On a runner that is a different IP, so the two cannot starve each
# other.
#
# And cadence does not matter for this half. A target set a few hours stale is
# fine, which is exactly what the poll loop could not tolerate.
#
# WHY THE SET NEEDED REBUILDING AT ALL
# ------------------------------------
# It was chosen on 30-day leaderboard volume, which turned out not to predict
# whether the order endpoint returns anything current. Measured 2026-09-15: of
# the 50 addresses being polled, 18 had returned no order in over 30 days, and
# gap_seconds was negative on 66.8% of all stored rows as a result. The worst
# case is the number one address by volume, trading 2.2 billion a day, whose
# 2,000 records are a fourteen-minute span from 147 days earlier. Liveness now
# comes from the endpoint the collector actually reads. See
# core/hyperliquid/collector.py, select_active_addresses.

name: Hyperliquid target refresh

on:
  schedule:
    # Daily. The set turns over slowly and a stale entry costs one wasted poll
    # per cycle, not a gap, so there is nothing to gain from running it often
    # and a per-IP rate budget to lose.
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: hl-target-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Probing runs at the collector's 10-second spacing and the yield is about
    # 40%, so filling 50 slots takes on the order of 120 probes, about 20
    # minutes. 35 leaves room without inviting a runaway.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet "psycopg[binary]" certifi

      - name: Rebuild the target set
        working-directory: backend
        env:
          COCKROACH_DATABASE_URL: ${{ secrets.COCKROACH_DATABASE_URL }}
        run: python scripts/hl_select_targets.py
