# Render Blueprint for the Practice Layer's Anvil fork.
#
# This defines ONLY the new Anvil Private Service. Add it to your existing
# Render setup (or keep as a separate blueprint). After deploy, set the
# backend web service's PRACTICE_RPC_URL to the internal URL of this service:
#     PRACTICE_RPC_URL = http://anvil-practice-fork:8545
# and the browser reaches the fork through the backend proxy /api/practice/rpc
# (so the frontend needs no direct RPC URL — VITE_PRACTICE_RPC_URL defaults to
# the same-origin proxy path).
services:
  - type: pserv            # Private Service: internal-only TCP, reachable by
    name: anvil-practice-fork  # other Render services on the private network.
    runtime: docker
    dockerfilePath: ./anvil/Dockerfile
    dockerContext: ./anvil
    plan: standard         # anvil forking is memory-hungry; free/starter may OOM.
    autoDeploy: false
    envVars:
      - key: PORT
        value: 8545
      # REQUIRED: an ARCHIVE-capable BSC RPC (see Dockerfile for why). Set this
      # secret in the Render dashboard (never commit it).
      #
      # Provisioning a free archive endpoint (recommended: Alchemy):
      #   1. dashboard.alchemy.com -> sign up -> Create app
      #   2. Chain = BNB Smart Chain, Network = Mainnet
      #   3. Copy the HTTPS URL: https://bnb-mainnet.g.alchemy.com/v2/<API_KEY>
      #      (archive is included on Alchemy's free tier for BNB Chain)
      #   Alternatives: BlockPI (generous free archive) or QuickNode (archive may
      #   need a paid add-on). Do NOT use free public endpoints
      #   (bsc-dataseed*, publicnode, ankr public) — they are pruned and crash
      #   Anvil with "missing trie node" once the fork block ages out of their
      #   pruning window (which a long-lived fork always hits).
      - key: FORK_RPC_URL
        sync: false
    disk:
      name: anvil-state    # persists /data/anvil-state.json across restarts,
      mountPath: /data     # so accumulated practice state survives redeploys.
      sizeGB: 1
