# Render Blueprint for this project's standalone services.
#
# Real removal, 2026-08-26: the Practice Layer's self-hosted Anvil fork
# (service `anvil-practice-fork`) has been fully removed from this project
# — real user decision, given repeated free-tier infrastructure
# instability that risked giving a fake/unreliable impression outweighing
# the real trust value of a "try before you spend" sandbox. If you deployed
# that service on Render from an earlier version of this blueprint, delete
# or suspend it manually from the Render dashboard — this file no longer
# manages it, and it will not be recreated on a future blueprint sync.

services:
  # Task 3's explainer agent (TermiX Advantage Report Q&A bot), self-hosted
  # on real BSC MAINNET — a real BNB Agent Studio seller agent, deliberately
  # NOT deployed via `bag deploy agent`'s AWS AgentCore path (this project's
  # standing rule: no paid/unknown-cost infrastructure anywhere). See
  # explainer-agent/Dockerfile's header comment for the real investigation
  # that confirmed this app has no hard AWS runtime dependency — it's a
  # plain Starlette app served by plain uvicorn.
  #
  # EPHEMERAL STATE (free tier): studio.toml's [storage].kind = "local" — a
  # submitted deliverable lives on the container's own disk and would
  # become unreadable across a restart/idle-cycle, even though its
  # on-chain reference survives. Accepted for now; revisit if it becomes a
  # real problem in practice.
  #
  # Real infrastructure kept intact for the TermiX Advantage Report (Task 3
  # — real jobs #56611/#56616/#56620/#56646, hash-verified). No longer
  # exposed as a site widget: the backend's /api/explainer-agent/ask
  # endpoint + the frontend's "Ask our explainer agent" widget were removed
  # 2026-08-20 (real user feedback: paying + waiting up to 10 real minutes
  # just to see a signed quote, no visible answer without payment, was
  # confusing UX). This service, its own ERC8183_AGENT_URL below, and its
  # real ERC-8004 registration (agent_id 270213) are unaffected.
  - type: web
    name: explainer-agent
    runtime: docker
    dockerfilePath: ./explainer-agent/Dockerfile
    dockerContext: ./explainer-agent
    plan: free
    autoDeploy: false
    healthCheckPath: /ping   # main.py's build_a2a_app() answers GET /ping with {"status":"Healthy"}
    envVars:
      # REQUIRED: the real agent wallet's password + its real V3 keystore
      # JSON (both generated locally this session — never committed to git,
      # matching the scaffold's own .gitignore). ensure_keystore_materialized()
      # (a real bnbagent_studio_core.wallet function) writes the keystore to
      # disk from this env var on boot — no custom secret-handling code needed.
      - key: WALLET_PASSWORD
        sync: false
      - key: WALLET_KEYSTORE_JSON
        sync: false
      # REQUIRED: the real Pieverse LLM gateway key (`bag llm activate`
      # wrote it to .env.local locally). Confirmed via
      # bnbagent_studio_core/llm.py's _resolve_provider_config(): without
      # this, build_model() raises RuntimeError for provider='pieverse-llm'.
      - key: PIEVERSE_LLM_API_KEY
        sync: false
      # REQUIRED: real value https://explainer-agent.onrender.com/erc8183 —
      # this service's own public URL + /erc8183. Without it, submit()
      # refuses to publish a deliverable stored via [storage].kind="local"
      # (confirmed via a real Render log: "Cannot publish deliverable:
      # storage returned a non-public URL and ERC8183_AGENT_URL is not
      # set"). main.py serves GET {this}/job/{id}/response itself.
      - key: ERC8183_AGENT_URL
        sync: false

  # ── Hyperliquid WebSocket collector ──────────────────────────────────────
  #
  # A BACKGROUND WORKER, NOT A THREAD INSIDE THE API, AND THE REASON IS THE
  # WINDOW
  #
  # What this collector is for is a six-hour stretch in which every ten-second
  # bucket carries a coverage row for the SAME set of addresses. The brain
  # endpoint selects its window that way on purpose (see
  # docs/hyperliquid-brain-spec.md section 10.1): it checks that the distinct
  # addresses across the whole window equal the per-bucket count, which is what
  # catches a swap. So the deliverable is not uptime, it is six uninterrupted
  # hours with an unchanged watch set.
  #
  # The API web service is redeployed on every push and recycles under its own
  # documented memory ratchet. A collector living inside it restarts whenever
  # the API restarts, and each restart re-runs pick_addresses against
  # hl_order_counts, which can return a different ten. That does not merely
  # pause the window, it invalidates it. Putting the two together would
  # guarantee the exact failure this service exists to end.
  #
  # Two smaller reasons point the same way. The API runs on 0.5 CPU and 512 MB
  # and already ratchets; ten WebSockets plus bucket buffers is not what that
  # instance needs. And a Render web service must bind $PORT and answer a
  # health check, neither of which this process does, so inside a web service
  # it would be an unsupervised background task rather than a process Render
  # can see fail.
  #
  # Cost: one 0.5c-512mb worker, the same plan as escrow-compat-audit-worker.
  #
  # SCOPE, stated because the number looks small: it watches ten addresses.
  # That is Hyperliquid's own limit of ten unique users per IP for user
  # subscriptions, not a budget choice, and ws_collector.run raises rather than
  # silently truncating if it is handed more.
  #
  # SUSPENDED 2026-09-19, AND DELIBERATELY SO
  #
  # The deliverable was a cross-window comparison: the same coefficient
  # measured over more than one complete six-hour window, which section 1.7 of
  # docs/hyperliquid-brain-spec.md calls the most important constraint in that
  # document. Three complete windows now exist, where two were needed. The sign
  # replicated across all three and the magnitude did not, spanning +0.1179 to
  # +0.3559.
  #
  # It is suspended rather than left running because further collection makes
  # the published answer narrower rather than better supported. Every new
  # window is drawn from ordinary conditions, and the range can only be pulled
  # in by them. The evidence that the magnitude moves is carried by the widest
  # window, and more ordinary windows dilute the presentation of that without
  # contradicting it.
  #
  # A blueprint sync does NOT resume a suspended service, but a person reading
  # this file will not see suspension state anywhere in it, which is why it is
  # written here. Resume it from the Render dashboard, or POST to
  # /v1/services/srv-damo4q67bikc73brdmq0/resume, when there is a NEW question
  # that needs a window. Do not resume it to accumulate more of the same.
  - type: worker
    name: hl-ws-collector
    runtime: python
    rootDir: backend
    plan: starter
    region: frankfurt
    autoDeploy: false        # a deploy restarts the process and ends the window
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/hl_ws_collect.py
    envVars:
      # The only one it needs. store.connect() builds its DSN from this and
      # nothing else; core/cockroach.py supplies the CA bundle from certifi.
      - key: COCKROACH_DATABASE_URL
        sync: false
      # Left unset so the collector runs until it is stopped. Setting it to a
      # number of seconds is how the script is run for a bounded test.
      - key: HL_WS_SECONDS
        sync: false
